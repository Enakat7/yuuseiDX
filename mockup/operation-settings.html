<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>設定 | YOU SAY!!</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar__brand">
      <div class="logo">YOU SAY<span>!!</span></div>
      <div class="tagline">Operation Console</div>
    </div>
    <nav class="sidebar__nav">
      <div class="sidebar__group-label">メニュー</div>
      <a class="sidebar__link" href="operation-dashboard.html">ダッシュボード</a>
      <a class="sidebar__link" href="operation-aggregation.html">件数集計</a>
      <a class="sidebar__link" href="operation-cost.html">管理費集計</a>
      <a class="sidebar__link" href="operation-schedule.html">稼働表</a>
      <a class="sidebar__link" href="operation-payment.html">支払通知書</a>
      <a class="sidebar__link" href="operation-advance.html">前払依頼書</a>
      <a class="sidebar__link" href="operation-master.html">マスタ管理</a>
      <a class="sidebar__link is-active" href="operation-settings.html">設定</a>
    </nav>
    <div class="sidebar__footer">
      <div class="user-chip">
        <div class="user-chip__avatar">管</div>
        <div class="user-chip__meta">
          <div class="user-chip__name">山田 太郎</div>
          <div class="user-chip__role">管理者</div>
        </div>
        <a href="login.html" class="user-chip__logout" title="ログアウト" aria-label="ログアウト">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </a>
      </div>
    </div>
  </aside>

  <div class="main">
    <main class="content">
      <div class="content__header">
        <div>
          <h2>システム設定</h2>
          <p class="content__lead">設定項目は現時点で未確定です。想定される項目のイメージを掲載しています。</p>
        </div>
      </div>

      <div class="grid grid--2">
        <div class="panel">
          <div class="panel__head"><h3>アカウント・権限管理</h3></div>
          <div class="panel__body">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr><th>氏名</th><th>権限</th><th></th></tr>
                </thead>
                <tbody>
                  <tr><td>山田 太郎</td><td><span class="tag">管理者</span></td><td><button class="btn btn--sm">編集</button></td></tr>
                  <tr><td>中村 恵</td><td><span class="tag">スタッフ</span></td><td><button class="btn btn--sm">編集</button></td></tr>
                </tbody>
              </table>
            </div>
            <button class="btn btn--ghost btn--sm" style="margin-top:14px;">+ アカウントを追加</button>
          </div>
        </div>

        <div class="panel">
          <div class="panel__head"><h3>通知設定</h3></div>
          <div class="panel__body">
            <ul style="display:flex; flex-direction:column; gap:14px;">
              <li class="flex--between">
                <span>支払通知書 確定時のメール通知</span>
                <span class="pill pill--confirmed">ON</span>
              </li>
              <li class="flex--between">
                <span>免許証等 期限切れ前アラート</span>
                <span class="pill pill--confirmed">ON</span>
              </li>
              <li class="flex--between">
                <span>前払依頼の申請通知</span>
                <span class="pill pill--pending">OFF</span>
              </li>
            </ul>
          </div>
        </div>

        <div class="panel">
          <div class="panel__head"><h3>帳票・発行タイミング</h3></div>
          <div class="panel__body">
            <div class="field">
              <label>発注書 発行タイミング</label>
              <select><option>月末（翌月分を自動発行）</option></select>
            </div>
            <div class="field">
              <label>支払通知書 発行タイミング（週払い）</label>
              <select><option>毎週金曜日</option></select>
            </div>
            <div class="field mb-0">
              <label>支払通知書 発行タイミング（月払い）</label>
              <select><option>月末締め後</option></select>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel__head"><h3>CSV / PDF 出力設定</h3></div>
          <div class="panel__body">
            <div class="field">
              <label>CSV 文字コード</label>
              <select><option>UTF-8</option><option>Shift-JIS</option></select>
            </div>
            <div class="field mb-0">
              <label>PDFデザインテンプレート</label>
              <select><option>標準テンプレート</option></select>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

</body>
</html>
