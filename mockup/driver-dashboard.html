<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ドライバーダッシュボード | YOU SAY!!</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="driver-shell">
  <header class="driver-topbar">
    <div class="logo">YOU SAY<span>!!</span></div>
    <a href="login.html" style="color:#fff; text-decoration:none; font-size:12px;">ログアウト</a>
  </header>

  <nav class="driver-tabs">
    <a href="driver-dashboard.html" class="is-active">ホーム</a>
    <a href="driver-order.html">発注書</a>
    <a href="driver-payment.html">支払通知書</a>
  </nav>

  <main class="driver-content">
    <div class="content__header" style="margin-bottom:16px;">
      <div>
        <h2 style="font-size:20px;">こんにちは、佐藤さん</h2>
        <p class="content__lead">西 / 西A地区</p>
      </div>
    </div>

    <div class="grid" style="grid-template-columns:1fr 1fr; margin-bottom:20px;">
      <div class="stat-card">
        <div class="stat-card__label">今月の稼働件数</div>
        <div class="stat-card__value">142<small>件</small></div>
      </div>
      <div class="stat-card">
        <div class="stat-card__label">前払可能額</div>
        <div class="stat-card__value">65<small>千円</small></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel__head">
        <h3>お知らせ</h3>
      </div>
      <div class="panel__body">
        <ul style="display:flex; flex-direction:column; gap:14px;">
          <li>
            <div class="flex--between">
              <strong class="text-sm">支払通知書（仮確定）が届きました</strong>
              <span class="pill pill--provisional">仮確定</span>
            </div>
            <p class="text-sm text-muted" style="margin-top:4px;">2026年7月分・週払い（7/18金 発行）</p>
          </li>
          <li>
            <div class="flex--between">
              <strong class="text-sm">8月分 発注書が発行されました</strong>
              <span class="pill pill--confirmed">発行済</span>
            </div>
            <p class="text-sm text-muted" style="margin-top:4px;">2026-07-31 発行予定</p>
          </li>
          <li>
            <div class="flex--between">
              <strong class="text-sm">免許証の有効期限が近づいています</strong>
              <span class="pill pill--alert">要更新</span>
            </div>
            <p class="text-sm text-muted" style="margin-top:4px;">期限：2026-08-02</p>
          </li>
        </ul>
      </div>
    </div>

    <div class="grid" style="grid-template-columns:1fr 1fr; margin-top:20px;">
      <a href="driver-order.html" class="panel" style="text-decoration:none; color:inherit; display:block; padding:22px; text-align:center;">
        <div style="font-weight:900; font-size:15px;">発注書</div>
        <div class="text-sm text-muted" style="margin-top:6px;">最新: 2026年8月分</div>
      </a>
      <a href="driver-payment.html" class="panel" style="text-decoration:none; color:inherit; display:block; padding:22px; text-align:center;">
        <div style="font-weight:900; font-size:15px;">支払通知書</div>
        <div class="text-sm text-muted" style="margin-top:6px;">最新: 仮確定 1件</div>
      </a>
    </div>
  </main>
</div>

</body>
</html>
