<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン | YOU SAY!!</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-shell">
  <div class="login-card">
    <div class="logo-block">
      <div class="logo">YOU SAY<span>!!</span></div>
      <div class="sub">配送業務管理システム</div>
    </div>

    <div class="role-toggle">
      <button type="button" class="opt is-active">オペレーション</button>
      <button type="button" class="opt">ドライバー</button>
    </div>

    <form>
      <div class="field">
        <label for="id">ログインID</label>
        <input type="text" id="id" placeholder="ID を入力">
      </div>
      <div class="field">
        <label for="pw">パスワード</label>
        <input type="password" id="pw" placeholder="●●●●●●●●">
      </div>
      <button type="button" class="btn btn--primary btn--block">ログイン</button>
    </form>

    <div class="login-demo">
      モックアップ用リンク（デザイン確認用）
      <a href="operation-dashboard.html">→ オペレーションダッシュボードを見る</a>
      <a href="driver-dashboard.html">→ ドライバーダッシュボードを見る</a>
    </div>
  </div>
</div>

</body>
</html>
