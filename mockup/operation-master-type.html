<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配送種別マスタ | YOU SAY!!</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar__brand">
      <div class="logo">YOU SAY<span>!!</span></div>
      <div class="tagline">Operation Console</div>
    </div>
    <nav class="sidebar__nav">
      <div class="sidebar__group-label">メニュー</div>
      <a class="sidebar__link" href="operation-dashboard.html">ダッシュボード</a>
      <a class="sidebar__link" href="operation-aggregation.html">件数集計</a>
      <a class="sidebar__link" href="operation-cost.html">管理費集計</a>
      <a class="sidebar__link" href="operation-schedule.html">稼働表</a>
      <a class="sidebar__link" href="operation-payment.html">支払通知書</a>
      <a class="sidebar__link" href="operation-advance.html">前払依頼書</a>
      <a class="sidebar__link is-active" href="operation-master.html">マスタ管理</a>
      <a class="sidebar__link" href="operation-settings.html">設定</a>
    </nav>
    <div class="sidebar__footer">
      <div class="user-chip">
        <div class="user-chip__avatar">管</div>
        <div class="user-chip__meta">
          <div class="user-chip__name">山田 太郎</div>
          <div class="user-chip__role">管理者</div>
        </div>
        <a href="login.html" class="user-chip__logout" title="ログアウト" aria-label="ログアウト">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </a>
      </div>
    </div>
  </aside>

  <div class="main">
    <main class="content">
      <div class="content__header">
        <div>
          <h2>マスタ管理</h2>
          <p class="content__lead">集計・単価マスタで使用する配送種別を管理します。</p>
        </div>
        <button class="btn btn--primary">+ 種別を追加</button>
      </div>

      <div class="tabbar" style="margin-bottom:22px;">
        <a href="operation-master.html">ドライバー</a>
        <a href="operation-master-price.html">単価</a>
        <a href="operation-master-type.html" class="is-active">配送種別</a>
      </div>

      <div class="panel">
        <div class="panel__head">
          <h3>配送種別一覧</h3>
          <span class="text-sm text-muted">10件</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>コード</th><th>種別名</th><th>単価マスタ対象</th><th></th></tr>
            </thead>
            <tbody>
              <tr><td>D01</td><td>配達完了①</td><td><span class="pill pill--confirmed">対象</span></td><td><button class="btn btn--sm">編集</button></td></tr>
              <tr><td>D02</td><td>配達完了②</td><td><span class="pill pill--pending">対象外</span></td><td><button class="btn btn--sm">編集</button></td></tr>
              <tr><td>M01</td><td>転居大口等①</td><td><span class="pill pill--confirmed">対象</span></td><td><button class="btn btn--sm">編集</button></td></tr>
              <tr><td>M02</td><td>転居大口等②</td><td><span class="pill pill--pending">対象外</span></td><td><button class="btn btn--sm">編集</button></td></tr>
              <tr><td>N01</td><td>夜間配送</td><td><span class="pill pill--confirmed">対象</span></td><td><button class="btn btn--sm">編集</button></td></tr>
              <tr><td>L01</td><td>大配送</td><td><span class="pill pill--confirmed">対象</span></td><td><button class="btn btn--sm">編集</button></td></tr>
              <tr><td>P01</td><td>集荷①</td><td><span class="pill pill--confirmed">対象</span></td><td><button class="btn btn--sm">編集</button></td></tr>
              <tr><td>P02</td><td>集荷②</td><td><span class="pill pill--confirmed">対象</span></td><td><button class="btn btn--sm">編集</button></td></tr>
              <tr><td>Y01</td><td>ゆうパケット</td><td><span class="pill pill--pending">対象外</span></td><td><button class="btn btn--sm">編集</button></td></tr>
              <tr><td>A01</td><td>不在個数</td><td><span class="pill pill--pending">対象外</span></td><td><button class="btn btn--sm">編集</button></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

</body>
</html>
